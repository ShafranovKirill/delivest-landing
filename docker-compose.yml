services:
  landing:
    build: .
    image: delivest-landing:latest
    container_name: delivest_landing
    restart: unless-stopped
    depends_on:
      - lead
    ports:
      - "127.0.0.1:${LANDING_PORT:-8090}:80"

  lead:
    build: ./lead
    image: delivest-landing-lead:latest
    container_name: delivest_landing_lead
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
